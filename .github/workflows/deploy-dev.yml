# Deploys develop to the dev environment on every merge (spec §13): the D1
# database (created on the first deploy, #357) and its migrations, then the
# sync Worker, then the web app (a static-assets Worker
# with the password gate in front, spec D9 and #39), then a verify that reads
# all three back from the live Custom Domains.
#
# Every Cloudflare secret is a `dev` ENVIRONMENT secret, and `dev` admits only
# the develop branch, so a fork PR or any other branch cannot reach them
# (spec §12.9, enforced by tests/unit/workflow-secrets.test.ts).
name: deploy-dev
on:
  push:
    branches: [develop]

permissions:
  contents: read

# Two merges in quick succession deploy in order; neither is cancelled, so the
# last one to finish is always the newest commit.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # A reusable-workflow call may not set timeout-minutes; ci.yml's own job
  # carries it (tests/unit/workflow-timeouts.test.ts).
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # A normal deploy takes 35 s; GitHub's default would be 360 minutes (#44).
    timeout-minutes: 10
    environment:
      name: dev
      url: https://dev.yawelo-idle.shyden.co.uk
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # From the repository root, which has no wrangler config to write to.
      - name: Create the dev D1 database if it does not exist yet
        run: node scripts/ensure-d1.ts yawelo-idle-dev
      - name: Apply D1 migrations (before the Worker, so new code never meets an old schema)
        working-directory: apps/sync-worker
        run: npx wrangler d1 migrations apply yawelo-idle-dev --remote
      - name: Deploy the sync Worker, stamped with this commit
        working-directory: apps/sync-worker
        run: npx wrangler deploy --var "COMMIT:${GITHUB_SHA}"
      - name: Build the web app, stamped with this commit
        env:
          YAWELO_IDLE_COMMIT: ${{ github.sha }}
        run: npm run build --workspace @yawelo-idle/web
      # The dev password reaches the Worker from the dev environment secret,
      # uploaded with the version itself, so no one types it into Cloudflare
      # (#357). The file lives in the runner's temp, outside the checkout.
      - name: Write the web app's secrets file (the dev password)
        env:
          DEV_PASSWORD: ${{ secrets.DEV_BASIC_AUTH_PASSWORD }}
        run: node scripts/dev-secrets.ts "$RUNNER_TEMP/web-secrets.json"
      - name: Deploy the web app with its secrets
        working-directory: apps/web
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/web-secrets.json"

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    # 8 s when the commit is already served; verify-dev waits at most 36 looks,
    # 5 s apart, for it to appear, then judges every check once (#83).
    timeout-minutes: 10
    environment:
      name: dev
      url: https://dev.yawelo-idle.shyden.co.uk
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Verify dev is password-gated, serves this commit, and D1 answers
        env:
          DEV_WEB_URL: https://dev.yawelo-idle.shyden.co.uk/
          DEV_SYNC_URL: https://dev-api.yawelo-idle.shyden.co.uk
          EXPECTED_SHA: ${{ github.sha }}
          DEV_BASIC_AUTH_PASSWORD: ${{ secrets.DEV_BASIC_AUTH_PASSWORD }}
        run: node scripts/verify-dev.ts
      - name: Post dev-verified on the deployed commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success -f context=dev-verified
          -f description="Live on dev: password-gated, this commit, D1 answers"
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
